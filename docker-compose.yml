services:
  todobee:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Published port. Overrides PORT=4000 from .env, which is only for local dev.
      PUBLIC_PORT: "3000"
      PORT: "3000"
      PROXY_NEXT: "1"
      NEXT_ORIGIN: http://127.0.0.1:3001
  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    ports:
      - "5000:5000"
